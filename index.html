<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ares Kuaför Pro Takvim</title>
    
    <!-- PWA / Ana Ekran ve Tarayıcı Logo (Favicon) Tanımları (JPG Destekli) -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --bg-color: #090909;
            --card-bg: #151515;
            --primary: #080808;
            --accent: #d8b36a;
            --accent-hover: #f0ce86;
            --red: #a61f26;
            --border: #393127;
            --text-main: #f7f3ec;
            --text-muted: #b8afa0;
            --gold-soft: rgba(216, 179, 106, .13);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background:
                radial-gradient(ellipse at top, rgba(166,31,38,.10), transparent 42%),
                var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
        }

        button, input, select { font: inherit; }
        button { transition: background .18s ease, border-color .18s ease, transform .18s ease; }
        button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Siyah ve altın premium üst bar */
        header {
            background: linear-gradient(110deg, #050505 0%, #17130d 100%);
            color: var(--text-main);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(216,179,106,.55);
            box-shadow: 0 5px 22px rgba(0,0,0,.35);
            z-index: 10;
        }
        header h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: .2px;
            color: var(--accent);
        }
        .header-right { display: flex; align-items: center; gap: 9px; }
        .user-badge {
            font-size: 12px;
            background: rgba(216,179,106,.12);
            color: #f3d99f;
            border: 1px solid rgba(216,179,106,.32);
            padding: 6px 11px;
            border-radius: 20px;
        }
        .btn-logout {
            background: rgba(166,31,38,.18);
            color: #ffb5b5;
            border: 1px solid rgba(214,70,76,.55);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-logout:hover { background: var(--red); color: white; }

        /* Tarih ve filtre kontrolleri */
        .top-controls {
            background: #11100e;
            border-bottom: 1px solid var(--border);
            padding: 13px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .date-picker-wrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
        .date-picker-wrap input {
            border: 1px solid #51432c;
            background: #1b1915;
            color: var(--text-main);
            padding: 8px 9px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            outline: none;
            color-scheme: dark;
            min-width: 0;
        }
        .btn-nav-date {
            background: #211d16;
            border: 1px solid #51432c;
            padding: 7px 11px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            color: var(--accent);
            font-size: 13px;
        }
        .btn-nav-date:hover { background: #33291a; }
        .btn-today {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 7px 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        .btn-today:hover { background: var(--gold-soft); }
        .btn-add {
            background: linear-gradient(135deg, #e7c77f, #c99b49);
            color: #171109;
            border: 1px solid #f1d99b;
            padding: 9px 15px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 3px 12px rgba(216,179,106,.13);
        }
        .btn-add:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .filter-select {
            border: 1px solid #51432c;
            background: #1b1915;
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            width: 100%;
            max-width: 260px;
            color-scheme: dark;
        }
        .summary-badge {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            background: var(--gold-soft);
            border: 1px solid rgba(216,179,106,.25);
            padding: 7px 11px;
            border-radius: 8px;
            white-space: nowrap;
        }

        /* Giriş ekranı */
        #login-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 20%, rgba(166,31,38,.22), transparent 48%),
                linear-gradient(145deg, #050505, #17130d);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: linear-gradient(155deg, #191714, #0d0d0d);
            color: var(--text-main);
            padding: 30px;
            border: 1px solid rgba(216,179,106,.4);
            border-radius: 18px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 18px 60px rgba(0,0,0,.48);
        }
        .login-logo {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: block;
            border: 2px solid var(--accent);
            box-shadow: 0 0 24px rgba(216,179,106,.14);
        }
        .login-box h2 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 23px;
            color: var(--accent);
        }
        .field { margin-bottom: 15px; }
        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 7px;
            letter-spacing: .7px;
            text-transform: uppercase;
        }
        .field input, .field select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #484035;
            background: #100f0d;
            color: var(--text-main);
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            color-scheme: dark;
        }
        .field input::placeholder { color: #81796c; }
        .field input:focus, .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(216,179,106,.1);
        }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #e7c77f, #c99b49);
            color: #171109;
            border: 1px solid #f1d99b;
            padding: 12px;
            border-radius: 9px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 9px;
            box-shadow: 0 4px 14px rgba(216,179,106,.12);
        }
        .btn-login:hover { background: var(--accent-hover); }

        /* Günlük saat çizelgesi */
        .timeline-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: auto;
            position: relative;
            display: flex;
            background: #0c0c0c;
            scrollbar-color: #64502f #111;
        }
        .time-column {
            width: 64px;
            min-width: 64px;
            border-right: 1px solid #30291e;
            background: #141310;
            z-index: 2;
        }
        .time-slot-label {
            height: 70px;
            border-bottom: 1px solid #28241d;
            font-size: 11px;
            font-weight: 600;
            color: #c7b994;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 8px;
        }
        .grid-content { flex: 1; min-width: 300px; position: relative; }
        .grid-row {
            height: 70px;
            border-bottom: 1px solid #28241d;
            cursor: pointer;
            transition: background .15s ease;
        }
        .grid-row:hover { background: rgba(216,179,106,.045); }

        /* Randevu kartları: altın kenar ve okunaklı metin */
        .app-event {
            position: absolute;
            left: 8px;
            right: 8px;
            background: linear-gradient(110deg, #211d16, #171512);
            border: 1px solid #4b3b23;
            border-left: 4px solid var(--accent);
            border-radius: 9px;
            padding: 7px 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,.22);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .app-event:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0,0,0,.32);
        }
        .app-event:active { transform: scale(.99); }
        .app-event .title {
            font-size: 13px;
            font-weight: 700;
            color: #f5d995;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-event .sub {
            font-size: 11px;
            color: #d2c9b8;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Randevu formu */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.76);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: linear-gradient(155deg, #191714, #0d0d0d);
            color: var(--text-main);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(216,179,106,.35);
            border-bottom: 0;
            border-radius: 20px 20px 0 0;
            padding: 21px;
            max-height: 88vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform .25s ease-out;
            box-shadow: 0 -12px 40px rgba(0,0,0,.35);
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid #3b3020;
            padding-bottom: 12px;
        }
        .modal-header h3 { font-size: 17px; font-weight: 700; color: var(--accent); }
        .close-btn {
            background: rgba(166,31,38,.16);
            border: 1px solid rgba(214,70,76,.35);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 21px;
            font-weight: bold;
            color: #ffb5b5;
            cursor: pointer;
        }
        .close-btn:hover { background: var(--red); color: white; }
        .hidden { display: none !important; }

        /* Telefon ekranları */
        @media (max-width: 640px) {
            header { padding: 12px 13px; }
            header h1 { font-size: 16px; }
            .header-right { gap: 6px; }
            .user-badge { max-width: 125px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .top-controls { padding: 10px; gap: 9px; }
            .controls-row { gap: 7px; }
            .date-picker-wrap { gap: 4px; flex: 1; }
            .date-picker-wrap input { width: 128px; padding: 8px 5px; font-size: 12px; }
            .btn-nav-date { padding: 7px 9px; }
            .btn-today { padding: 7px 8px; }
            .btn-add { padding: 9px 10px; font-size: 12px; }
            .filter-select { max-width: none; min-width: 0; flex: 1; }
            .summary-badge { font-size: 11px; padding: 7px 8px; }
            .time-column { width: 52px; min-width: 52px; }
            .time-slot-label { font-size: 10px; }
            .grid-content { min-width: 270px; }
            .app-event { left: 5px; right: 5px; padding: 6px 7px; }
            .app-event .title { font-size: 12px; }
            .app-event .sub { font-size: 10px; }
            .modal-card { padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
            .login-box { padding: 25px 21px; }
        }

        @media (max-width: 380px) {
            .date-picker-wrap input { width: 112px; }
            .btn-today { font-size: 11px; padding: 7px 6px; }
            .btn-add { padding: 8px; }
            .user-badge { display: none; }
        }


        .mobile-bottom-nav { display: none; }

        @media (max-width: 640px) {
            .mobile-bottom-nav {
                display: grid;
                grid-template-columns: 1fr 1.35fr 1fr;
                gap: 7px;
                padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
                background: rgba(8,8,8,.97);
                border-top: 1px solid rgba(216,179,106,.42);
                box-shadow: 0 -6px 22px rgba(0,0,0,.32);
                z-index: 20;
            }
            .mobile-bottom-nav button {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                min-height: 45px;
                border: 1px solid #393127;
                border-radius: 10px;
                background: #171512;
                color: #d8c9a7;
                font-size: 10px;
                font-weight: 600;
                cursor: pointer;
            }
            .mobile-bottom-nav .nav-symbol {
                font-size: 19px;
                line-height: 1;
                color: var(--accent);
            }
            .mobile-bottom-nav .mobile-nav-primary {
                background: linear-gradient(135deg, #e7c77f, #c99b49);
                color: #171109;
                border-color: #f1d99b;
            }
            .mobile-bottom-nav .mobile-nav-primary .nav-symbol { color: #171109; }
            .timeline-container { padding-bottom: 2px; }
        }

    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <form class="login-box" onsubmit="girisYap(event)">
            <img src="logo.jpg" alt="Ares Kuaför Logo" class="login-logo">
            <h2>Ares Kuaför Pro</h2>
            <div class="field">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="" autocapitalize="words" autocorrect="off">
            </div>
            <div class="field">
                <label>Şifre</label>
                <input type="password" id="password" placeholder="" autocapitalize="words" autocorrect="off">
            </div>
            <button type="submit" class="btn-login">Sisteme Giriş Yap</button>
        </form>
    </div>

    <!-- ANA PANEL -->
    <header>
        <h1>Ares Kuaför</h1>
        <div class="header-right">
            <div class="user-badge" id="user-display">Personel</div>
            <button class="btn-logout" onclick="cikisYap()" title="Çıkış Yap">Çıkış</button>
        </div>
    </header>

    <div class="top-controls">
        <div class="controls-row">
            <div class="date-picker-wrap">
                <button class="btn-nav-date" onclick="tarihDegistir(-1)">&lt;</button>
                <input type="date" id="selected-date" onchange="randevulariYukle()">
                <button class="btn-nav-date" onclick="tarihDegistir(1)">&gt;</button>
                <button class="btn-today" onclick="buguneGit()">Bugün</button>
            </div>
            <button class="btn-add" onclick="modalAc(false)">+ Yeni Randevu</button>
        </div>
        <div class="controls-row">
            <select id="filter_personel" class="filter-select" onchange="randevulariYukle()">
                <option value="">Tüm Personeller</option>
            </select>
            <div class="summary-badge" id="daily-summary">0 Randevu</div>
        </div>
    </div>

    <!-- SAATLİK ÇİZELGE -->
    <div class="timeline-container">
        <div class="time-column" id="time-labels"></div>
        <div class="grid-content" id="grid-content">
            <div id="grid-rows"></div>
            <div id="events-layer"></div>
        </div>
    </div>


    <!-- Mobil hızlı menü: mevcut randevu fonksiyonlarını kullanır -->
    <nav class="mobile-bottom-nav" aria-label="Hızlı işlemler">
        <button type="button" onclick="buguneGit()">
            <span class="nav-symbol">⌂</span><span>Bugün</span>
        </button>
        <button type="button" class="mobile-nav-primary" onclick="modalAc(false)">
            <span class="nav-symbol">＋</span><span>Randevu Ekle</span>
        </button>
        <button type="button" onclick="document.getElementById('filter_personel').focus()">
            <span class="nav-symbol">♙</span><span>Personel</span>
        </button>
    </nav>

    <!-- POP-UP (MODAL) FORM -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Yeni Randevu Oluştur</h3>
                <button class="close-btn" onclick="modalKapat()">&times;</button>
            </div>
            
            <input type="hidden" id="edit_randevu_id" value="">

            <div class="field">
                <label>Müşteri Adı Soyadı</label>
                <input type="text" id="m_adi" placeholder="Örn: Ayşe Yılmaz">
            </div>
            <div class="field">
                <label>Telefon</label>
                <input type="text" id="m_tel" placeholder="05xx xxx xx xx">
            </div>
            <div class="field">
                <label>Yapılacak İşlem</label>
                <input type="text" id="m_hizmet" placeholder="Örn: Mikro Kaynak, Boya">
            </div>
            <div class="field">
                <label>İşlemi Yapacak Personel</label>
                <select id="m_personel_select">
                    <!-- Personeller dinamik yüklenecek -->
                </select>
            </div>
            <div class="field">
                <label>Saat</label>
                <input type="time" id="m_saat" value="10:00">
            </div>
            <div class="field">
                <label>Özel Not / Kapora Bilgisi</label>
                <input type="text" id="m_not" placeholder="">
            </div>

            <button class="btn-login" id="btn-submit" style="margin-top:15px;" onclick="randevuKaydet()">Randevuyu Kaydet & Bildir</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://pomcbxgouhfvpdgwyepq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kpfQg9YJAh28CTTJxKgsEw_JP3Nqz-f';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let aktifUser = null;
    let personelListesi = [];
    let mevcutRandevular = [];
    const SAAT_BASLANGIC = 8;
    const SAAT_BITIS = 21;

    // Personel Renk Kodları
    const PERSONEL_RENKLERI = [
        '#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'
    ];

    document.getElementById('selected-date').value = new Date().toISOString().split('T')[0];
    cizelgeOlustur();
    oturumKontrol();

    function oturumKontrol() {
        const kayitli = localStorage.getItem('ares_aktif_user');
        if (kayitli) {
            try {
                aktifUser = JSON.parse(kayitli);
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('user-display').innerText = aktifUser.ad_soyad;
                personelleriYukle();
                randevulariYukle();
            } catch(e) {
                localStorage.removeItem('ares_aktif_user');
            }
        }
    }

    function cikisYap() {
        if(confirm("Sistemden çıkış yapmak istediğinize emin misiniz?")) {
            localStorage.removeItem('ares_aktif_user');
            aktifUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
        }
    }

    function buguneGit() {
        document.getElementById('selected-date').value = new Date().toISOString().split('T')[0];
        randevulariYukle();
    }

    function tarihDegistir(gun) {
        const dateInput = document.getElementById('selected-date');
        const d = new Date(dateInput.value || new Date());
        d.setDate(d.getDate() + gun);
        dateInput.value = d.toISOString().split('T')[0];
        randevulariYukle();
    }

    function cizelgeOlustur() {
        const labels = document.getElementById('time-labels');
        const rows = document.getElementById('grid-rows');
        labels.innerHTML = '';
        rows.innerHTML = '';

        for (let i = SAAT_BASLANGIC; i <= SAAT_BITIS; i++) {
            const timeStr = (i < 10 ? '0' + i : i) + ':00';
            const label = document.createElement('div');
            label.className = 'time-slot-label';
            label.innerText = timeStr;
            labels.appendChild(label);

            const row = document.createElement('div');
            row.className = 'grid-row';
            row.title = timeStr + ' saatine randevu ekle';
            row.onclick = () => {
                modalAc(false);
                document.getElementById('m_saat').value = timeStr;
            };
            rows.appendChild(row);
        }
    }

    async function girisYap(event) {
        if(event) event.preventDefault();

        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();

        if(!u || !p) { alert('Lütfen bilgileri girin'); return; }

        const { data, error } = await supabaseClient
            .from('personeller')
            .select('*')
            .eq('kullanici_adi', u)
            .eq('sifre', p);

        if (error || !data || data.length === 0) {
            alert('Hatalı kullanıcı adı veya şifre!');
        } else {
            aktifUser = data[0];
            localStorage.setItem('ares_aktif_user', JSON.stringify(aktifUser));
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('user-display').innerText = aktifUser.ad_soyad;
            personelleriYukle();
            randevulariYukle();
        }
    }

    async function personelleriYukle() {
        const { data } = await supabaseClient.from('personeller').select('*');
        if(data) {
            personelListesi = data;
            const select = document.getElementById('m_personel_select');
            const filterSelect = document.getElementById('filter_personel');
            
            const prevFilter = filterSelect.value;

            select.innerHTML = '';
            filterSelect.innerHTML = '<option value="">Tüm Personeller</option>';

            data.forEach((p, index) => {
                const opt = document.createElement('option');
                opt.value = p.ad_soyad;
                opt.innerText = p.ad_soyad;
                select.appendChild(opt);

                const filterOpt = document.createElement('option');
                filterOpt.value = p.ad_soyad;
                filterOpt.innerText = p.ad_soyad;
                filterSelect.appendChild(filterOpt);
            });

            if (prevFilter) filterSelect.value = prevFilter;
        }
    }

    function modalAc(isEdit = false, randevuData = null) { 
        document.getElementById('modal-overlay').classList.add('active'); 
        if(isEdit && randevuData) {
            document.getElementById('modal-title').innerText = "Randevuyu Düzenle";
            document.getElementById('btn-submit').innerText = "Değişiklikleri Kaydet & Bildir";
            document.getElementById('edit_randevu_id').value = randevuData.id;
            document.getElementById('m_adi').value = randevuData.musteri_adi || '';
            document.getElementById('m_tel').value = randevuData.telefon || '';
            document.getElementById('m_hizmet').value = randevuData.hizmet || '';
            document.getElementById('m_personel_select').value = randevuData.islem_yapan_personel || '';
            
            const saatParcasi = randevuData.tarih_saat.split('T')[1] || randevuData.tarih_saat.split(' ')[1];
            if(saatParcasi) {
                document.getElementById('m_saat').value = saatParcasi.substring(0, 5);
            }
            document.getElementById('m_not').value = randevuData.notlar || '';
        } else {
            document.getElementById('modal-title').innerText = "Yeni Randevu Oluştur";
            document.getElementById('btn-submit').innerText = "Randevuyu Kaydet & Bildir";
            document.getElementById('edit_randevu_id').value = "";
            document.getElementById('m_adi').value = '';
            document.getElementById('m_tel').value = '';
            document.getElementById('m_hizmet').value = '';
            document.getElementById('m_not').value = '';
            document.getElementById('m_saat').value = '10:00';
        }
    }
    
    function modalKapat() { document.getElementById('modal-overlay').classList.remove('active'); }

    // Otomatik Telegram Bildirimi (Ekleme / Güncelleme Uyumlu)
    async function sendTelegramNotification(randevuObj, isUpdate = false) {
        const TELEGRAM_BOT_TOKEN = '8932934663:AAEqhcs4JhxlxJyIA0tA1vnGBSDjlQ0f3CE';
        const TELEGRAM_CHAT_ID = '-5429836951';

        const baslik = isUpdate ? "✏️ *Randevu Güncellendi!*" : "🔔 *Yeni Randevu Talebi!*";

        const message = baslik + "\n\n" +
                        "👤 *Müşteri:* " + randevuObj.musteri_adi + "\n" +
                        "📞 *Telefon:* " + (randevuObj.telefon || 'Belirtilmedi') + "\n" +
                        "💇‍♂️ *Personel:* " + randevuObj.islem_yapan_personel + "\n" +
                        "✂️ *İşlem:* " + randevuObj.hizmet + "\n" +
                        "📅 *Tarih:* " + randevuObj.tarih + "\n" +
                        "⏰ *Saat:* " + randevuObj.saat + "\n" +
                        (randevuObj.notlar ? "📝 *Not:* " + randevuObj.notlar + "\n" : "") +
                        "\n📌 *İşlem Yapan:* " + (aktifUser ? aktifUser.ad_soyad : 'Sistem') +
                        "\n\n🌐 *Tüm Randevuları Gör:* https://areskuafor.com.tr/ares-randevu/";

        try {
            await fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {

                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });
        } catch (error) {
            console.error('Telegram gönderim hatası:', error);

    async function randevuKaydet() {
        const editId = document.getElementById('edit_randevu_id').value;
        const musteri_adi = document.getElementById('m_adi').value.trim();
        const telefon = document.getElementById('m_tel').value.trim();
        const hizmet = document.getElementById('m_hizmet').value.trim();
        const selectEl = document.getElementById('m_personel_select');
        const islem_yapan_personel = selectEl.value;
        const saat = document.getElementById('m_saat').value;
        const notlar = document.getElementById('m_not').value.trim();
        const tarih = document.getElementById('selected-date').value;

        if(!musteri_adi || !hizmet || !saat) {
            alert('Müşteri adı, işlem ve saat zorunludur.');
            return;
        }

        const tarihSaatISO = `${tarih}T${saat}:00`;
        const isUpdate = !!editId;

        sendTelegramNotification({
            musteri_adi,
            telefon,
            hizmet,
            islem_yapan_personel,
            tarih,
            saat,
            notlar
        }, isUpdate);

        let error = null;

        if(isUpdate) {
            const res = await supabaseClient.from('randevular').update({
                musteri_adi,
                telefon,
                hizmet,
                islem_yapan_personel,
                tarih_saat: tarihSaatISO,
                notlar
            }).eq('id', editId);
            error = res.error;
        } else {
            const res = await supabaseClient.from('randevular').insert([{
                musteri_adi,
                telefon,
                hizmet,
                islem_yapan_personel,
                tarih_saat: tarihSaatISO,
                islem_suresi_dk: 60,
                notlar,
                personel_id: aktifUser ? aktifUser.id : null,
                durum: 'Aktif'
            }]);
            error = res.error;
        }

        if(error) {
            alert('Supabase İşlem Hatası: ' + error.message);
        } else {
            modalKapat();

            document.getElementById('m_adi').value = '';
            document.getElementById('m_tel').value = '';
            document.getElementById('m_hizmet').value = '';
            document.getElementById('m_not').value = '';
            document.getElementById('edit_randevu_id').value = '';
            
            randevulariYukle();
        }
    }

    async function randevulariYukle() {
        const seciliTarih = document.getElementById('selected-date').value;
        const seciliPersonel = document.getElementById('filter_personel').value;
        const baslangic = `${seciliTarih}T00:00:00`;
        const bitis = `${seciliTarih}T23:59:59`;

        let query = supabaseClient
            .from('randevular')
            .select('*')
            .gte('tarih_saat', baslangic)
            .lte('tarih_saat', bitis)
            .neq('durum', 'İptal');

        if (seciliPersonel) {
            query = query.eq('islem_yapan_personel', seciliPersonel);
        }

        const { data } = await query;

        const layer = document.getElementById('events-layer');
        layer.innerHTML = '';

        if(!data) {
            document.getElementById('daily-summary').innerText = '0 Randevu';
            return;
        }

        mevcutRandevular = data;
        document.getElementById('daily-summary').innerText = `${data.length} Randevu`;

        data.forEach(r => {
            const saatString = r.tarih_saat.split('T')[1] || r.tarih_saat.split(' ')[1];
            if (!saatString) return;

            const [saatStr, dakStr] = saatString.split(':');
            const saat = parseInt(saatStr, 10);
            const dakika = parseInt(dakStr, 10);

            const topPx = ((saat - SAAT_BASLANGIC) * 70) + ((dakika / 60) * 70);
            const heightPx = 65;

            if(topPx >= 0) {
                const el = document.createElement('div');
                el.className = 'app-event';
                el.style.top = topPx + 'px';
                el.style.height = heightPx + 'px';
                
                // Personel Bazlı Renk Belirleme
                const pIndex = personelListesi.findIndex(p => p.ad_soyad === r.islem_yapan_personel);
                const color = pIndex >= 0 ? PERSONEL_RENKLERI[pIndex % PERSONEL_RENKLERI.length] : 'var(--accent)';
                el.style.borderLeftColor = color;

                const saatFormat = (saat < 10 ? '0'+saat : saat) + ':' + (dakika < 10 ? '0'+dakika : dakika);

                el.innerHTML = `
                    <div>
                        <div class="title">${saatFormat} - ${r.musteri_adi}</div>
                        <div class="sub"><b>İşlem:</b> ${r.hizmet} ${r.islem_yapan_personel ? ' | 👤 ' + r.islem_yapan_personel : ''}</div>
                    </div>
                `;

                el.onclick = (e) => {
                    e.stopPropagation(); // Satır tıklama olayını engeller
                    randevuSecimAksiyonu(r);
                };

                layer.appendChild(el);
            }
        });
    }

    function randevuSecimAksiyonu(randevu) {
        let mesaj = `${randevu.musteri_adi} randevusu için yapmak istediğiniz işlemi seçin:\n\n1 - Randevuyu Düzenle\n2 - Randevuyu İptal Et`;
        if (randevu.telefon) {
            mesaj += `\n3 - Müşteriyi Ara (${randevu.telefon})\n4 - WhatsApp'tan Mesaj Gönder`;
        }
        mesaj += `\n\n(Vazgeçmek için İptal'e basın)`;

        const secim = prompt(mesaj, "1");

        if (secim === "1") {
            modalAc(true, randevu);
        } else if (secim === "2") {
            if(confirm(`${randevu.musteri_adi} randevusunu iptal etmek istediğinize emin misiniz?`)) {
                randevuIptal(randevu.id);
            }
        } else if (secim === "3" && randevu.telefon) {
            window.location.href = "tel:" + randevu.telefon;
        } else if (secim === "4" && randevu.telefon) {
            let tel = randevu.telefon.replace(/[^0-9]/g, '');
            if(tel.startsWith('0')) tel = '9' + tel;
            if(!tel.startsWith('90')) tel = '90' + tel;
            const text = encodeURIComponent(`Merhaba ${randevu.musteri_adi}, Ares Kuaför randevunuz ile ilgili iletişime geçiyoruz.`);
            window.open(`https://wa.me/${tel}?text=${text}`, '_blank');
        }
    }

    async function randevuIptal(id) {
        await supabaseClient.from('randevular').update({ durum: 'İptal' }).eq('id', id);
        randevulariYukle();
    }
</script>
