<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Kuaför - Randevu Sistemi</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 12px;
            box-sizing: border-box;
            margin: 15px;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1a252f;
        }

        /* Gizleme Sınıfı */
        .hidden {
            display: none !important;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ / ŞİFRE EKRANI -->
    <div class="container" id="loginBox">
        <h2>Ares Kuaför Giriş</h2>
        <form onsubmit="checkPassword(event)">
            <div class="form-group">
                <label for="passwordInput">Giriş Şifresi</label>
                <input type="password" id="passwordInput" placeholder="Şifrenizi girin" required>
            </div>
            <button type="submit">Giriş Yap</button>
            <div id="loginError" class="error-msg hidden">Hatalı şifre! Lütfen tekrar deneyin.</div>
        </form>
    </div>

    <!-- 2. RANDEVU FORMU EKRANI (Şifre girilene kadar gizli) -->
    <div class="container hidden" id="appointmentBox">
        <h2>Ares Kuaför Randevu</h2>
        <form id="appointmentForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="musteri_adi">Adınız Soyadınız</label>
                <input type="text" id="musteri_adi" required placeholder="Örn: Ahmet Yılmaz">
            </div>

            <div class="form-group">
                <label for="musteri_tel">Telefon Numaranız</label>
                <input type="tel" id="musteri_tel" required placeholder="05XX XXX XX XX">
            </div>

            <div class="form-group">
                <label for="personel_adi">Personel Seçimi</label>
                <select id="personel_adi" required>
                    <option value="">Personel Seçin</option>
                    <option value="Ali">Ali</option>
                    <option value="Kenan">Kenan</option>
                    <option value="Emre">Emre</option>
                    <option value="Tuğba">Tuğba</option>
                </select>
            </div>

            <div class="form-group">
                <label for="islem">İşlem / Hizmet</label>
                <select id="islem" required>
                    <option value="">İşlem Seçin</option>
                    <option value="Saç Kesimi">Saç Kesimi</option>
                    <option value="Mikro Kaynak">Mikro Kaynak</option>
                    <option value="Hayalet Kaynak">Hayalet Kaynak</option>
                    <option value="Boya / Röfle">Boya / Röfle</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tarih">Randevu Tarihi</label>
                <input type="date" id="tarih" required>
            </div>

            <div class="form-group">
                <label for="saat">Randevu Saati</label>
                <input type="time" id="saat" required>
            </div>

            <button type="submit">Randevu Oluştur</button>
        </form>
    </div>

    <script>
        // Giriş Şifresi (Buradan istediğiniz şifreyi belirleyebilirsiniz)
        const DOGRU_SIFRE = "1234";

        // Şifre Kontrol Fonksiyonu
        function checkPassword(event) {
            event.preventDefault();
            const girilenSifre = document.getElementById('passwordInput').value;
            const errorElement = document.getElementById('loginError');

            if (girilenSifre === DOGRU_SIFRE) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('appointmentBox').classList.remove('hidden');
            } else {
                errorElement.classList.remove('hidden');
            }
        }

        // Telegram Bildirim Fonksiyonu
        async function sendTelegramNotification(data) {
            const TELEGRAM_BOT_TOKEN = '8932934663:AAEqhcs4JhxlxJyIA0tA1vnGBSDjlQ0f3CE';
            const TELEGRAM_CHAT_ID = '-5429836951';

            const message = "🔔 *Yeni Randevu Talebi!*\n\n" +
                            "👤 *Müşteri:* " + data.musteri_adi + "\n" +
                            "📞 *Telefon:* " + data.musteri_tel + "\n" +
                            "💇‍♂️ *Personel:* " + data.personel_adi + "\n" +
                            "✂️ *İşlem:* " + data.islem + "\n" +
                            "📅 *Tarih:* " + data.tarih + "\n" +
                            "⏰ *Saat:* " + data.saat;

            try {
                await fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.error('Telegram gönderim hatası:', error);
            }
        }

        // Form Gönderim İşleyicisi
        async function handleFormSubmit(event) {
            event.preventDefault();

            const appointmentData = {
                musteri_adi: document.getElementById('musteri_adi').value,
                musteri_tel: document.getElementById('musteri_tel').value,
                personel_adi: document.getElementById('personel_adi').value,
                islem: document.getElementById('islem').value,
                tarih: document.getElementById('tarih').value,
                saat: document.getElementById('saat').value
            };

            await sendTelegramNotification(appointmentData);

            alert('Randevunuz başarıyla oluşturuldu ve ekibe iletildi!');
            document.getElementById('appointmentForm').reset();
        }
    </script>
</body>
</html>
