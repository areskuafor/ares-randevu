<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ares Kuaför Pro Takvim</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #0f172a;
            --accent: #2563eb;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Üst Bar */
        header { background: var(--primary); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10; }
        header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
        .user-badge { font-size: 13px; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 20px; }

        /* Tarih ve Kontrol Barları */
        .top-controls { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        .date-picker-wrap { display: flex; align-items: center; gap: 8px; }
        .date-picker-wrap input { border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-weight: 600; color: var(--text-main); font-size: 14px; outline: none; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px; }

        /* Giriş Ekranı */
        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: white; padding: 28px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-box h2 { font-size: 22px; text-align: center; margin-bottom: 20px; color: var(--primary); }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; }
        .btn-login { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; }

        /* Saatlik Çizelge / Grid Alanı */
        .timeline-container { flex: 1; overflow-y: auto; overflow-x: auto; position: relative; display: flex; background: var(--card-bg); }
        .time-column { width: 60px; min-width: 60px; border-right: 1px solid var(--border); background: #f1f5f9; z-index: 2; }
        .time-slot-label { height: 70px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-muted); display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; }
        
        .grid-content { flex: 1; min-width: 300px; position: relative; }
        .grid-row { height: 70px; border-bottom: 1px solid var(--border); box-sizing: border-border-box; }

        /* Randevu Kartları (Çizelge Üzerinde) */
        .app-event { position: absolute; left: 8px; right: 8px; background: #eff6ff; border-left: 4px solid var(--accent); border-radius: 6px; padding: 6px 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); cursor: pointer; overflow: hidden; transition: transform 0.1s; }
        .app-event:active { transform: scale(0.98); }
        .app-event .title { font-size: 13px; font-weight: 700; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-event .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Pop-up (Modal) Ekranı */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: white; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s ease-out; }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .modal-header h3 { font-size: 17px; font-weight: 700; }
        .close-btn { background: none; border: none; font-size: 20px; font-weight: bold; color: var(--text-muted); cursor: pointer; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Ares Kuaför Pro</h2>
            <div class="field">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="admin">
            </div>
            <div class="field">
                <label>Şifre</label>
                <input type="password" id="password" placeholder="123">
            </div>
            <button class="btn-login" onclick="girisYap()">Sisteme Giriş Yap</button>
        </div>
    </div>

    <!-- ANA PANEL -->
    <header>
        <h1>Ares Kuaför</h1>
        <div class="user-badge" id="user-display">Personel</div>
    </header>

    <div class="top-controls">
        <div class="date-picker-wrap">
            <input type="date" id="selected-date" onchange="randevulariYukle()">
        </div>
        <button class="btn-add" onclick="modalAc()">+ Yeni Randevu</button>
    </div>

    <!-- SAATLİK ÇİZELGE -->
    <div class="timeline-container">
        <div class="time-column" id="time-labels"></div>
        <div class="grid-content" id="grid-content">
            <div id="grid-rows"></div>
            <div id="events-layer"></div>
        </div>
    </div>

    <!-- POP-UP (MODAL) FORM -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Yeni Randevu Oluştur</h3>
                <button class="close-btn" onclick="modalKapat()">&times;</button>
            </div>
            
            <div class="field">
                <label>Müşteri Adı Soyadı</label>
                <input type="text" id="m_adi" placeholder="Örn: Ayşe Yılmaz">
            </div>
            <div class="field">
                <label>Telefon</label>
                <input type="text" id="m_tel" placeholder="05xx xxx xx xx">
            </div>
            <div class="field">
                <label>Yapılacak İşlem</label>
                <input type="text" id="m_hizmet" placeholder="Örn: Mikro Kaynak, Boya">
            </div>
            <div class="field">
                <label>İşlemi Yapacak Personel</label>
                <input type="text" id="m_personel" placeholder="Örn: Emre, Ahmet">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="field" style="flex:1;">
                    <label>Saat</label>
                    <input type="time" id="m_saat" value="10:00">
                </div>
                <div class="field" style="flex:1;">
                    <label>Süre (Dk)</label>
                    <select id="m_sure">
                        <option value="30">30 Dakika</option>
                        <option value="60" selected>1 Saat</option>
                        <option value="90">1.5 Saat</option>
                        <option value="120">2 Saat</option>
                        <option value="180">3 Saat</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label>Özel Not / Kapora Bilgisi</label>
                <input type="text" id="m_not" placeholder="Örn: 150gr mikro kaynak, kapora alındı.">
            </div>

            <button class="btn-login" style="margin-top:15px;" onclick="randevuKaydet()">Randevuyu Takvime Ekle</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://pomcbxgouhfvpdgwyepq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kpfQg9YJAh28CTTJxKgsEw_JP3Nqz-f';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let aktifUser = null;
    const SAAT_BASLANGIC = 8; // 08:00
    const SAAT_BITIS = 21;    // 21:00

    // Sayfa Açılış Ayarları
    document.getElementById('selected-date').value = new Date().toISOString().split('T')[0];
    cizelgeOlustur();

    function cizelgeOlustur() {
        const labels = document.getElementById('time-labels');
        const rows = document.getElementById('grid-rows');
        labels.innerHTML = '';
        rows.innerHTML = '';

        for (let i = SAAT_BASLANGIC; i <= SAAT_BITIS; i++) {
            const timeStr = (i < 10 ? '0' + i : i) + ':00';
            
            const label = document.createElement('div');
            label.className = 'time-slot-label';
            label.innerText = timeStr;
            labels.appendChild(label);

            const row = document.createElement('div');
            row.className = 'grid-row';
            rows.appendChild(row);
        }
    }

    async function girisYap() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();

        if(!u || !p) { alert('Lütfen bilgileri girin'); return; }

        const { data, error } = await supabaseClient
            .from('personeller')
            .select('*')
            .eq('kullanici_adi', u)
            .eq('sifre', p);

        if (error || !data || data.length === 0) {
            alert('Hatalı kullanıcı adı veya şifre!');
        } else {
            aktifUser = data[0];
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('user-display').innerText = aktifUser.ad_soyad;
            randevulariYukle();
        }
    }

    function modalAc() {
        document.getElementById('modal-overlay').classList.add('active');
    }

    function modalKapat() {
        document.getElementById('modal-overlay').classList.remove('active');
    }

    async function randevuKaydet() {
        const musteri_adi = document.getElementById('m_adi').value.trim();
        const telefon = document.getElementById('m_tel').value.trim();
        const hizmet = document.getElementById('m_hizmet').value.trim();
        const islem_yapan_personel = document.getElementById('m_personel').value.trim();
        const saat = document.getElementById('m_saat').value;
        const sure = parseInt(document.getElementById('m_sure').value);
        const notlar = document.getElementById('m_not').value.trim();
        const tarih = document.getElementById('selected-date').value;

        if(!musteri_adi || !hizmet || !saat) {
            alert('Müşteri adı, işlem ve saat zorunludur.');
            return;
        }

        const tarihSaatISO = `${tarih}T${saat}:00`;

        const { error } = await supabaseClient.from('randevular').insert([{
            musteri_adi,
            telefon,
            hizmet,
            islem_yapan_personel,
            tarih_saat: tarihSaatISO,
            islem_suresi_dk: sure,
            notlar,
            personel_id: aktifUser.id,
            durum: 'Aktif'
        }]);

        if(error) {
            alert('Hata: ' + error.message);
        } else {
            modalKapat();
            // Formu Temizle
            document.getElementById('m_adi').value = '';
            document.getElementById('m_tel').value = '';
            document.getElementById('m_hizmet').value = '';
            document.getElementById('m_not').value = '';
            randevulariYukle();
        }
    }

    async function randevulariYukle() {
        const seciliTarih = document.getElementById('selected-date').value;
        const baslangic = `${seciliTarih}T00:00:00`;
        const bitis = `${seciliTarih}T23:59:59`;

        const { data, error } = await supabaseClient
            .from('randevular')
            .select('*')
            .gte('tarih_saat', baslangic)
            .lte('tarih_saat', bitis)
            .neq('durum', 'İptal');

        const layer = document.getElementById('events-layer');
        layer.innerHTML = '';

        if(error || !data) return;

        data.forEach(r => {
            const dateObj = new Date(r.tarih_saat);
            const saat = dateObj.getHours();
            const dakika = dateObj.getMinutes();

            // Pozisyon Hesaplama (Her saat 70px yüksekliğinde)
            const topPx = ((saat - SAAT_BASLANGIC) * 70) + ((dakika / 60) * 70);
            const heightPx = ((r.islem_suresi_dk || 60) / 60) * 70;

            if(topPx >= 0) {
                const el = document.createElement('div');
                el.className = 'app-event';
                el.style.top = topPx + 'px';
                el.style.height = (heightPx - 4) + 'px';
                
                const saatFormat = (saat < 10 ? '0'+saat : saat) + ':' + (dakika < 10 ? '0'+dakika : dakika);

                el.innerHTML = `
                    <div class="title">${saatFormat} - ${r.musteri_adi}</div>
                    <div class="sub"><b>İşlem:</b> ${r.hizmet} ${r.islem_yapan_personel ? ' | 👤 ' + r.islem_yapan_personel : ''}</div>
                `;

                el.onclick = () => {
                    if(confirm(`${r.musteri_adi} randevusunu iptal etmek istediğinize emin misiniz?`)) {
                        randevuIptal(r.id);
                    }
                };

                layer.appendChild(el);
            }
        });
    }

    async function randevuIptal(id) {
        await supabaseClient.from('randevular').update({ durum: 'İptal' }).eq('id', id);
        randevulariYukle();
    }
</script>

</body>
</html>
